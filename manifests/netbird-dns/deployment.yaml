apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dns
  namespace: netbird-dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-dns
  template:
    metadata:
      labels:
        app: netbird-dns
    spec:
      containers:
        - name: netbird-dns
          image: coredns/coredns:1.11.3
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
      volumes:
        - name: config
          configMap:
            name: netbird-dns-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-dns-config
  namespace: netbird-dns
data:
  Corefile: |
    .:53 {
      errors
      health
      ready
      log
      forward . 8.8.8.8 8.8.4.4
    }
